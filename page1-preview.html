<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e4f7ed" />
  <link rel="icon" type="image/png" href="assets/app-icon-square.png" />
  <link rel="apple-touch-icon" href="assets/app-icon-square.png" />
  <meta name="description" content="Nurse Calendar — ต้นแบบหน้าปฏิทินบันทึกเวร โทนเขียวพาสเทล" />
  <title>ปฏิทินบันทึกเวร — Nurse Calendar (หน้า 1 ตรงภาพต้นแบบ)</title>
  <style>
:root {
  --ink:#264d42; --ink-strong:#18493d; --muted:#84958f; --green:#278668; --green-mid:#56b398;
  --mint:#e9f8ef; --mint-soft:#f0fbf5; --mint-border:#d8eae0; --stroke:#dfece4;
  --white:#fff; --pink:#f8dbeb; --purple:#eadcf9; --sky:#d9f1ff;
  --shade:0 11px 30px rgba(62,125,96,.09), 0 2px 7px rgba(46,117,82,.03);
  --font:"Noto Sans Thai","Noto Looped Thai", "Thonburi", "Tahoma", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);background:#e2f2e9;min-width:320px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #57bba0;outline-offset:2px}
[hidden]{display:none!important}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-shell{position:relative;isolation:isolate;max-width:600px;min-height:100svh;margin:0 auto;background:linear-gradient(140deg,#e5f8ec 0%,#f0fbf6 26%,#e0f5ed 69%,#eefaf4 100%);overflow:clip}
.app-shell:before,.app-shell:after{content:"";position:absolute;z-index:-1;width:410px;height:410px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(139,220,185,.28),rgba(139,220,185,0) 70%)}
.app-shell:before{left:-220px;top:260px}.app-shell:after{right:-220px;top:780px}
.hero{height:172px;padding:22px 22px 25px;background:radial-gradient(ellipse at 88% -20%,#c1eedb 0%,transparent 46%),linear-gradient(110deg,#e0f8e9,#d3f2e5 58%,#e5fbf1);position:relative;overflow:hidden;border-bottom:1px solid rgba(189,225,205,.6)}
.hero:after{content:"";position:absolute;width:185px;height:185px;border-radius:50%;background:rgba(255,255,255,.24);top:80px;right:-100px}
.hero-deco{position:absolute;pointer-events:none;opacity:.56;color:#53b996}.hero-deco-1{left:47%;top:16px;font-size:22px;color:#f4a7c9}.hero-deco-2{right:12%;top:18px;font-size:29px}.hero-deco-3{right:22%;bottom:24px;font-size:28px;color:#e89fbb}
.hero-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-brand{display:flex;align-items:center;min-width:0;flex:1;gap:11px}
.brand-logo-wrap{width:94px;height:100px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:24px;background:rgba(255,255,255,.68);box-shadow:0 9px 20px rgba(57,130,90,.1);overflow:hidden}
.brand-logo{width:108px;max-width:none;height:90px;object-fit:contain;mix-blend-mode:multiply}
.brand-copy{min-width:0;position:relative}.brand-eyebrow{font-size:9px;font-weight:800;letter-spacing:1.1px;color:#5b9f86;display:flex;align-items:center;gap:5px;white-space:nowrap}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:#69c5a5}
.brand-copy h1{font-size:clamp(21px,5.4vw,29px);line-height:1.27;margin:8px 0 4px;font-weight:900;letter-spacing:-.65px;color:#21644e;white-space:nowrap}
.brand-copy p{font-size:11px;line-height:1.6;font-weight:600;margin:0;color:#6a9a84}
.round-icon,.square-btn{display:grid;place-items:center;flex:none;background:#fff;border:1px solid #d8e7de;box-shadow:0 3px 9px rgba(44,123,78,.06);color:#366e5c}
.round-icon{border-radius:50%;width:38px;height:38px}.round-icon svg{width:20px;height:20px}
.hero-subline{position:relative;z-index:1;font-size:10px;color:#74a58d;margin:12px 0 0 4px;display:flex;align-items:center;gap:7px;letter-spacing:.2px}
.pulse-dot,.green-pulse,.note-dot{width:7px;height:7px;border-radius:50%;background:#6fcca8;display:inline-block;flex:none}
.medical-plus{font-size:15px;color:#b7dcbb;margin-left:5px}
.main-content{position:relative;margin-top:-9px;padding:0 13px 30px}
.surface{background:rgba(255,255,255,.97);border:1px solid #e5f0e9;border-radius:23px;box-shadow:var(--shade);margin-bottom:12px;overflow:hidden}
.month-surface{padding:17px 12px 12px;scroll-margin-top:8px}
.month-head,.section-heading{display:flex;align-items:center;justify-content:space-between;gap:6px}
.month-head{margin:0 4px 15px}
.month-title-row,.heading-line{display:flex;align-items:center;gap:9px;min-width:0}
.section-icon{display:grid;place-items:center;flex:none;background:#e4f5eb;border-radius:14px;color:#26896c;width:39px;height:39px;font-size:19px}.section-icon svg{width:23px;height:23px}
.month-title-row h2{font-size:clamp(20px,5.2vw,27px);line-height:1.33;letter-spacing:-.4px;margin:0 0 3px;font-weight:900;white-space:nowrap}
.muted{color:#8a9993}.tiny{font-size:11px}.month-title-row p{margin:0}
.calendar-actions{display:flex;align-items:center;gap:5px}.square-btn{border-radius:13px;width:34px;height:36px;padding:0}.square-btn svg{width:17px;height:17px;stroke-width:2.5}
.today-btn{background:linear-gradient(#fff,#ecf8f2);border:1px solid #d1e9da;color:#3b8064;font-weight:800;border-radius:13px;height:36px;padding:0 10px;font-size:12px;box-shadow:0 3px 10px rgba(45,124,80,.04)}
.calendar-viewport{overflow:hidden;border-radius:16px;border:1px solid #dce9e2}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:auto;background:#e2ece7;gap:1px}
.week-name{display:grid;place-items:center;background:#eaf8f0;color:#729183;font-size:12px;font-weight:850;height:42px;user-select:none}
.week-name.sunday{color:#d77987}.week-name.saturday{color:#688ec3}
.day-cell{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:92px;background:#fff;border:0;border-radius:0;padding:7px 3px 4px;text-align:left;color:#325348;transition:background .13s;touch-action:manipulation;overflow:hidden}
.day-cell.other{background:#f7faf8;color:#bac9c2}.day-cell.today:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#74b99a}.day-cell.has-event:not(.today):before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:#badbc7}
.day-cell.selected{box-shadow:inset 0 0 0 2px #3ba685;background:#f4fcf7}.day-cell.drop-target{background:#e2f8e9}
.day-cell:active{background:#ecf9f2}
.day-num{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;align-self:flex-start;width:26px;height:26px;border-radius:50%;font-size:14px;line-height:1;font-weight:600;margin:0 0 5px 1px}
.day-cell.today .day-num{background:#278a69;color:#fff;font-weight:800;box-shadow:0 2px 8px rgba(30,133,90,.18)}
.day-cell.sunday:not(.other) .day-num{color:#d97885}.day-cell.saturday:not(.other) .day-num{color:#6385b7}.day-cell.today .day-num{color:#fff!important}
.day-cell.other .day-num{color:#c2d0c9}
.day-badges{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0}
.day-pill{max-width:100%;min-width:0;display:block;border-radius:5px;font-size:9px;padding:2px 3px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.1px;text-align:left}
.day-pill.ev{color:#ba6b78;background:#ffe5ed}.day-pill.ev.blue{background:#e6f4fa;color:#4b879d}.day-pill.ev.green{background:#e5f3e9;color:#467f60}.day-pill.ev.purple{background:#f0eaff;color:#8663a6}
.day-more{color:#668f7b;font-size:9px;text-align:right;padding-right:2px;font-weight:700}
.calendar-foot{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:10px 3px 0;color:#8b9e93;font-size:10px;line-height:1.45}
.calendar-foot>span{display:flex;align-items:center;gap:5px}.auto-saved{white-space:nowrap}.auto-saved svg{width:17px;height:17px;color:#35876b}
.shift-surface,.events-surface{padding:15px 13px}
.section-heading{align-items:flex-start;gap:8px;margin-bottom:13px}
.heading-line h2{font-size:17px;margin:0;line-height:1.7;font-weight:900}.section-heading .section-icon{width:31px;height:31px;border-radius:10px;font-size:17px;background:#e5f6ed}
.section-heading .muted{margin:1px 0 0;font-size:11px;line-height:1.5}.helper-text{white-space:nowrap;align-self:center;color:#65a68b;font-size:11px;font-weight:750}
.shift-scroller,.event-scroller{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 9px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}.shift-scroller::-webkit-scrollbar,.event-scroller::-webkit-scrollbar{display:none}
.shift-card{flex:0 0 87px;min-height:85px;background:#fff;border:1px solid #d8ebdd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px 8px;box-shadow:0 2px 5px rgba(75,125,96,.04);scroll-snap-align:start;color:#385448;position:relative}
.shift-card.selected{background:#ebf9f1;border-color:#51a98c;box-shadow:0 0 0 2px rgba(79,174,133,.18),0 5px 15px rgba(60,135,94,.12)}
.shift-graphic{height:28px;width:34px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.shift-name{font-size:10px;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.shift-select-hint{font-size:9px;color:#9cb2a6;display:flex;gap:3px;align-items:center}.shift-card.selected .shift-select-hint{color:#287d60;font-weight:850}
.shift-bottom{font-size:10px;color:#91a89a;display:flex;gap:6px;align-items:center;margin:2px 3px 0}
.event-scroller{gap:8px}
.event-card{border:1px solid #e7ece9;border-radius:15px;min-height:83px;min-width:150px;max-width:170px;flex:0 0 150px;padding:10px 9px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;text-align:left;position:relative;color:#2a5a48}
.event-card.pink{background:#fff1f5}.event-card.green{background:#eaf9ef}.event-card.blue{background:#edf8ff}.event-card.purple{background:#f3efff}
.event-label{font-size:11px;font-weight:850;line-height:1.5;display:flex;gap:6px;align-items:flex-start}.event-label .emoji{font-size:16px}.event-date{font-size:10px;color:#93a69b}
.event-edit-ico{position:absolute;right:7px;bottom:8px;font-size:14px;color:#78a48e}
.text-action{border:0;background:none;color:#299073;font-size:11px;font-weight:850;white-space:nowrap;padding:9px 2px}.text-action span{font-size:18px;vertical-align:-1px}
.add-event-wide{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:#f0faf3;color:#30896d;border:1px dashed #a6d7b9;border-radius:13px;min-height:40px;font-weight:800;font-size:12px;margin-top:5px}
.plus-circle{background:#3ca987;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;color:white;font-size:18px;font-weight:400;line-height:1}
.footer-note{display:flex;gap:8px;justify-content:center;align-items:center;text-align:left;font-size:11px;color:#7f9b8a;padding:11px 0 3px;line-height:1.6}.footer-note small{font-size:10px}.footer-flower{color:#a4d8b8;font-size:23px}
.tabbar{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:stretch;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border:1px solid #dbece1;border-bottom:0;box-shadow:0 -5px 24px rgba(58,112,80,.1);border-radius:22px 22px 0 0;padding:6px 5px max(7px,env(safe-area-inset-bottom));min-height:66px}
.tab{border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;min-width:0;border-radius:15px;color:#94a6a0;padding:7px 1px;font-size:9px;font-weight:750;white-space:nowrap}
.tab svg{width:22px;height:22px}.tab.active{background:#e9f8ee;color:#218763}.tab.active span{font-weight:900}.tab:active:not(.active){background:#eff7f1}
.selection-banner{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(79px + env(safe-area-inset-bottom));width:min(570px,calc(100% - 28px));padding:10px 11px 10px 15px;border-radius:14px;color:#fff;background:#247d61;box-shadow:0 8px 24px rgba(30,95,68,.28);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;gap:9px}.banner-text{display:flex;align-items:center;gap:8px}.banner-close{display:grid;place-items:center;border:0;background:#ffffff30;color:white;border-radius:9px;width:30px;height:30px}
.toast{position:fixed;z-index:200;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);background:#265b48;color:white;padding:11px 17px;border-radius:30px;font-size:12px;font-weight:750;max-width:calc(100vw - 26px);box-shadow:0 7px 22px #25564344;opacity:0;pointer-events:none;transition:opacity .17s,transform .17s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(24,53,44,.28);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:12px}
.sheet{width:min(760px,100%);background:#fff;border-radius:28px;max-height:min(92dvh,1100px);overflow-y:auto;overscroll-behavior:contain;padding:10px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 15px 50px rgba(27,75,52,.14);border:1px solid #e0eee6}
.sheet-top{position:sticky;top:-10px;background:#fff;z-index:2;display:flex;align-items:center;justify-content:center;height:40px;border-bottom:1px solid #f0f4f2;margin:0 -18px 10px;padding:0 18px}.sheet-handle{width:56px;height:5px;background:#dce9e0;border-radius:8px}.sheet-x{position:absolute;right:18px;top:6px;display:grid;place-items:center;width:40px;height:40px;background:#f3f8f4;border:1px solid #dbeae1;border-radius:50%;font-size:14px;color:#648877}
.sheet-heading{font-weight:900;font-size:20px;margin:13px 0 3px;color:#225e4c}.sheet-sub{color:#82998b;font-size:12px;margin:0 0 18px}.field-label{display:block;font-size:12px;font-weight:850;margin:14px 0 7px;color:#2d6753}
.sheet-input,.sheet-select,.sheet-textarea{width:100%;border:1px solid #d4e6da;background:#fbfefa;color:#244e40;border-radius:13px;min-height:43px;padding:10px 12px;font-size:14px;outline:none}
.sheet-textarea{min-height:76px;resize:vertical}.sheet-input:focus,.sheet-textarea:focus,.sheet-select:focus{border-color:#66ba93}
.sheet-actions{display:flex;gap:9px;margin-top:18px}.primary-btn,.ghost-btn,.danger-btn{min-height:43px;padding:9px 15px;border-radius:13px;font-weight:800;font-size:13px;border:0}.primary-btn{background:#318d6c;color:white;flex:1}.ghost-btn{background:#edf7f0;color:#387e62}.danger-btn{background:#fff0f0;color:#b45d68}
.day-detail-list{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 5px}.detail-shift{border:1px solid #e3eee8;border-radius:11px;padding:7px 9px;display:flex;gap:9px;align-items:center;font-size:12px;font-weight:750}.detail-shift button{background:#fff0f2;color:#cc6679;border:0;border-radius:9px;width:24px;height:24px;font-size:16px;line-height:1}
.sheet-hint{background:#f0faf3;border-radius:11px;color:#658e79;padding:10px 12px;font-size:11px;line-height:1.6;margin:12px 0}
.quick-add{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:7px;padding:2px 0 8px}.quick-add button{white-space:nowrap;border:1px solid #d5e9da;background:#fff;color:#448066;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}
.event-list-modal{display:flex;flex-direction:column;gap:7px}.event-row{border:1px solid #e7efea;background:#fbfdfa;border-radius:11px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.event-row .event-desc{display:flex;align-items:center;gap:9px;min-width:0}.event-row small{color:#91a299}.event-row button{border:0;background:#e8f7ed;color:#237a5a;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:850}
.theme-warning{color:#a47c40;background:#fff9e9;border:1px solid #f2e9c9;padding:11px;border-radius:10px;font-size:11px;line-height:1.6;margin:12px 0}
.sheet-check{display:flex;gap:8px;align-items:center;font-size:12px;color:#507763;margin-top:12px}.sheet-check input{accent-color:#338a6c;width:16px;height:16px}

.day-editor{padding:2px 0 0}
.day-editor-head h2{font-size:28px;line-height:1.25;margin:0;color:#1f5b49;font-weight:900}
.day-editor-head .editor-date{font-size:15px;color:#7a9489;margin:6px 0 18px}
.soft-note{font-size:14px;color:#5b947d;margin:0 0 12px;font-weight:700}
.editor-section-title{font-size:16px;font-weight:900;color:#2a5f4d;margin:18px 0 10px}
.shift-option-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shift-option{border:2px solid #dbece1;border-radius:18px;padding:12px 14px;background:#fff;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.shift-option.selected{border-color:#5eb28f;background:#f6fcf8;box-shadow:0 0 0 3px rgba(94,178,143,.08)}
.shift-left{display:flex;gap:10px;align-items:flex-start;min-width:0}
.check-round{width:30px;height:30px;border-radius:11px;border:2px solid #9eb1a7;background:#fff;display:grid;place-items:center;flex:none;color:transparent}
.shift-option.selected .check-round{background:#4ea27e;border-color:#4ea27e;color:#fff}
.color-dot{width:14px;height:14px;border-radius:50%;margin-top:8px;flex:none;border:2px solid rgba(0,0,0,.04)}
.shift-label strong{display:block;font-size:15px;color:#295a4b;margin-bottom:2px}
.shift-label small{display:block;color:#8a9d94;font-size:12px;line-height:1.35}
.shift-badge{align-self:center;border-radius:14px;background:#fff5f6;color:#c46e7e;padding:8px 10px;font-size:12px;font-weight:800;border:1px solid #f4d6df;text-align:center;min-width:110px}
.ot-box{margin:8px 0 0 42px;background:#edf7f0;border:1px solid #dcebdd;border-radius:18px;padding:14px}
.ot-box label{display:block;font-size:15px;font-weight:800;color:#356b58;margin-bottom:10px}
.ot-row{display:grid;grid-template-columns:92px 1fr 130px;gap:14px}
.ot-row button,.ot-row input{min-height:54px;border-radius:16px;border:2px solid #cddfd4;background:#fff;color:#295a4b;font-size:18px;font-weight:900;text-align:center}
.ot-hint{font-size:12px;color:#90a198;margin-top:10px}
.icon-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.icon-tile{border:2px solid #dcece2;background:#fff;border-radius:16px;min-height:62px;display:grid;place-items:center;color:#4e8570}
.icon-tile.active{border-color:#57ab88;background:#f2fbf5}
.icon-tile svg{width:28px;height:28px;stroke-width:1.9}
.icon-none{font-size:13px;font-weight:800;color:#577f69}
.editor-textarea{width:100%;min-height:96px;border:2px solid #d7e6dd;border-radius:18px;padding:16px;background:#fff;color:#264d42;font-size:16px;resize:vertical}
.dual-actions,.main-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.delete-day{margin-top:16px;min-height:52px;border-radius:18px;border:2px solid #f1d7dd;background:#fff7f8;color:#ca6d7e;font-size:16px;font-weight:900;padding:0 18px;display:inline-flex;align-items:center;justify-content:center}
.wide-add-special{margin-top:18px;width:100%;min-height:58px;border-radius:18px;border:2px solid #d6e7dc;background:#fff;color:#2c5d4c;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}
.copy-btn,.paste-btn,.secondary-btn{min-height:52px;border-radius:18px;border:2px solid #d6e7dc;background:#fff;color:#2a5f4d;font-size:16px;font-weight:900}

function renderCalendar(){
 const year=viewDate.getFullYear(),month=viewDate.getMonth();
 $('calendarHeading').textContent=`${thMonths[month]} ${year+543}`;
 $('monthSubtitle').textContent=`เดือนที่ ${month+1} · ${year+543}`;
 const start=new Date(year,month,1),offset=start.getDay();
 const total=new Date(year,month+1,0).getDate();
 const rows=Math.ceil((offset+total)/7);
 const today=iso(new Date());
 let html=weekdays.map((d,i)=>`<div class="week-name ${i===0?'sunday':i===6?'saturday':''}" role="columnheader">${d}</div>`).join('');
 for(let k=0;k<rows*7;k++){
   const d=new Date(year,month,1-offset+k),day=iso(d),inMonth=d.getMonth()===month;
   const wd=d.getDay(),dayEntry=state.days[day]||{};
   const events=eventFor(day);const shifts=(dayEntry.shifts||[]).map(getShift).filter(Boolean);
   let badges='';
   if(inMonth || shifts.length || events.length){
     const list=[...events.map(e=>`<span class="day-pill ev ${esc(e.tone)}" title="${esc(e.title)}">${v6PillIcon(e.emoji)} ${esc(e.title)}</span>`),
       ...shifts.map(s=>`<span class="day-pill" style="background:${esc(pastel(s.color))};color:#3c564b" title="${esc(s.name)}">${esc(s.short||s.name)}${dayEntry.excluded?.[s.id]?' ❌':''}</span>`)];
     const hasNote=dayEntry.note && dayEntry.note.trim();
     if(hasNote)list.push(`<span class="day-note" title="${esc(dayEntry.note)}">${v6DayIcon(dayEntry.icon)}${esc(dayEntry.note)}</span>`);
     const max=3; badges=list.slice(0,max).join('')+(list.length>max?`<span class="day-more">+${list.length-max} เพิ่มเติม</span>`:'');
   }
   const classes=['day-cell',!inMonth?'other':'',day===today?'today':'',events.length?'has-event':'',chosenDate===day?'selected':'',wd===0?'sunday':wd===6?'saturday':''].filter(Boolean).join(' ');
   const aria=`${dateLabel(day)}${shifts.length?` มี ${shifts.length} เวร`:''}${events.length?` มี ${events.length} วันสำคัญ`:''}`;
   html+=`<button class="${classes}" type="button" data-day="${day}" role="gridcell" aria-label="${esc(aria)}"><span class="day-num">${d.getDate()}</span>${((dayEntry.shifts||[]).length||String(dayEntry.note||'').trim())?`<span class="cell-menu-dot" data-context-day="${day}" aria-hidden="true">⋯</span>`:''}<span class="day-badges">${badges}</span></button>`;
 }
 $('calendarGrid').innerHTML=html;
 $('calendarGrid').querySelectorAll('[data-day]').forEach(el=>{
   el.addEventListener('click',ev=>{
     if(ev.target.closest('[data-context-day]')){ev.stopPropagation();openCellContextMenu(el.dataset.day,el);return;}
     if(preventNextDateClick===el.dataset.day){preventNextDateClick=null;return;}
     onDateClick(el.dataset.day);
   });
   el.addEventListener('contextmenu',ev=>{ev.preventDefault();openCellContextMenu(el.dataset.day,el);});
   el.addEventListener('touchstart',()=>{
     clearTimeout(contextPressTimer);

   },{passive:true});

 if(task.mode==='move')delete state.days[task.source];
 pendingDayTransfer=null;

 save();render();notify(task.mode==='move'?'ย้ายข้อมูลเวรสำเร็จ ✓':'คัดลอกข้อมูลเวรสำเร็จ ✓');

 showSheet(`<div class="v6-modal"><h2 class="v6-title" id="sheetHeading">${edit?'แก้ไขการ์ดเวร':'เพิ่มการ์ดเวร'}</h2><p class="v6-sub">เฉพาะชื่อ สี และการแสดงผลการ์ด</p><div class="v6-data"><label>ชื่อเวร<input id="v6shiftname" type="text" maxlength="35" value="${esc(original?.name||'')}" placeholder="เช่น เวรพิเศษ"></label><label>สีการ์ด<input id="v6shiftcolor" type="color" value="${esc(original?.color||'#a4e7d3')}" style="width:100%;height:49px;padding:4px"></label><div class="v6-sub" style="margin-top:12px">การลบการ์ดจะซ่อนออกจากแถบเลือกเวร โดยเก็บรายการเวรเดิมในปฏิทินไว้</div></div><div class="v6-footer"><button class="v6-btn ${edit?'pink':''}" id="v6cancelShift">${edit?'ลบการ์ด':'ยกเลิก'}</button><button class="v6-btn primary" id="v6saveShift">บันทึก</button></div></div>`);
 $('v6cancelShift').onclick=()=>{if(!edit){closeSheet();return;}if(!confirm('ซ่อนการ์ดนี้จากรายการ? ข้อมูลเวรเก่าจะยังคงอยู่'))return;original.archived=true;save();closeSheet();render();notify('ซ่อนการ์ดแล้ว (ข้อมูลเก่าคงอยู่)');};
 $('v6saveShift').onclick=()=>{const name=$('v6shiftname').value.trim(),color=$('v6shiftcolor').value;if(!name){notify('กรุณากรอกชื่อเวร');return;}if(edit){original.name=name;original.short=name;original.color=color;}else state.shifts.push({id:`custom-${Date.now()}`,name,short:name,color,icon:''});save();closeSheet();renderShifts();notify('บันทึกการ์ดเรียบร้อย');};
}
function openShiftManager(){
 function paint(){
  const previousScroll=$('overlay').hidden?0:$('sheetBody').scrollTop;
  const available=displayedShiftCards();
  showSheet(`<div class="v6-modal"><h2 class="v6-title" id="sheetHeading">จัดการการ์ดเวร</h2><p class="v6-sub v8-order-note">กด ↑ หรือ ↓ เพื่อจัดลำดับการ์ดเวรด้านหน้า–ด้านหลัง บันทึกอัตโนมัติและไม่เปลี่ยนข้อมูลเวรในปฏิทิน</p><div class="v6-list">${available.map((s,i)=>`<div class="v6-line v8-manage-row"><span class="v6-line-icon"><span style="width:18px;height:18px;flex:none;border-radius:7px;background:${esc(pastel(s.color))}"></span><span>${esc(s.name)}</span></span><div class="v8-sort-toolbar"><button type="button" data-shift-up="${esc(s.id)}" aria-label="เลื่อน ${esc(s.name)} ขึ้น" ${i===0?'disabled':''}>↑</button><button type="button" data-shift-down="${esc(s.id)}" aria-label="เลื่อน ${esc(s.name)} ลง" ${i===available.length-1?'disabled':''}>↓</button><button class="v6-line-btn" type="button" data-edit-shift="${esc(s.id)}">แก้ไข</button></div></div>`).join('')}</div><div class="v6-footer"><button class="v6-btn" id="v6closeShifts">ปิด</button><button class="v6-btn primary" id="v6addShift">+ เพิ่มการ์ด</button></div></div>`);
  $('sheetBody').scrollTop=previousScroll;
  const change=(id,direction)=>{
   const order=displayedShiftCards().map(s=>s.id),index=order.indexOf(id),next=index+direction;
   if(index<0||next<0||next>=order.length)return;
   [order[index],order[next]]=[order[next],order[index]];
   state.shiftCardOrder=order;save();renderShifts();paint();
  };
  $('sheetBody').querySelectorAll('[data-shift-up]').forEach(b=>b.onclick=()=>change(b.dataset.shiftUp,-1));
  $('sheetBody').querySelectorAll('[data-shift-down]').forEach(b=>b.onclick=()=>change(b.dataset.shiftDown,1));
  $('sheetBody').querySelectorAll('[data-edit-shift]').forEach(b=>b.onclick=()=>openShiftCreator(b.dataset.editShift));
  $('v6closeShifts').onclick=closeSheet;
  $('v6addShift').onclick=()=>openShiftCreator();
 }
 paint();
}
function openInfo(){
 showSheet(`<h2 class="sheet-heading" id="sheetHeading">🩺 ต้นแบบหน้าปฏิทิน</h2>
 <p class="sheet-sub">หน้า 1 จากทั้งหมด 6 หน้า · ออกแบบเพื่อทดสอบบน iPhone และ Android</p>
 <div class="sheet-hint">ข้อมูลที่แก้ไขในหน้านี้บันทึกเฉพาะในเบราว์เซอร์นี้ <strong>ยังไม่ซิงค์ Supabase</strong> และจะไม่เปลี่ยนข้อมูลใน Nurse Calendar ที่ใช้งานจริง</div>
 <p style="font-size:13px;line-height:1.8">• เลือกการ์ดเวรด้านล่าง แล้วแตะวันที่ในปฏิทินเพื่อคัดลอกเวร<br>• แตะวันที่เพื่อเพิ่ม/ลบเวรและแก้หมายเหตุ<br>• แตะการ์ดวันสำคัญเพื่อแก้ไข หรือกดเพิ่มวันสำคัญใหม่</p>
 <div class="sheet-actions"><button type="button" class="ghost-btn" id="resetDemo">คืนค่าข้อมูลตัวอย่าง</button><button type="button" class="primary-btn" id="closeInfo">เข้าใจแล้ว</button></div>`);
 $('closeInfo').onclick=closeSheet;
 $('resetDemo').onclick=()=>{if(!confirm('คืนค่าข้อมูลตัวอย่างหน้า 1? การแก้ไขเฉพาะต้นแบบนี้จะหายไป'))return;state=fresh();viewDate=new Date(2026,9,1);selectedShift=null;chosenDate=null;save();closeSheet();render();notify('คืนค่าตัวอย่างแล้ว');};
}
$('prevBtn').addEventListener('click',()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);chosenDate=null;renderCalendar();renderEvents();});
$('nextBtn').addEventListener('click',()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);chosenDate=null;renderCalendar();renderEvents();});
$('todayBtn').addEventListener('click',()=>{const now=new Date();viewDate=new Date(now.getFullYear(),now.getMonth(),1);chosenDate=iso(now);renderCalendar();renderEvents();});

$('manageShiftsBtn').addEventListener('click',openShiftManager);

$('allEventsBtn').addEventListener('click',openAllEvents);
$('cancelSelectionBtn').addEventListener('click',()=>{selectedShift=null;pendingDayTransfer=null;closeCellContextMenu();renderSelection();renderShifts();});
$('closeSheetBtn').addEventListener('click',closeSheet);
$('overlay').addEventListener('click',(ev)=>{if(ev.target===$('overlay'))closeSheet();});
document.addEventListener('keydown',(ev)=>{if(ev.key==='Escape')closeSheet();});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.tab!=='calendar')notify('หน้านี้จะพัฒนาต่อในขั้นถัดไป 🌱');else window.scrollTo({top:0,behavior:'smooth'});}));
render();
const v6preview=new URLSearchParams(location.search).get('preview');
if(v6preview==='day')setTimeout(()=>openDayEditor('2026-10-21'),50);
if(v6preview==='events')setTimeout(()=>openEventEditor('e2'),50);
if(v6preview==='manage')setTimeout(openShiftManager,50);
if(v6preview==='context')setTimeout(()=>{const c=document.querySelector('[data-day="2026-10-22"]');if(c)openCellContextMenu('2026-10-22',c);},250);
})();

</script>
